name: Clean Environment Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/clean_environment_tests.yaml"
      - ".github/scripts/*windows-preview.ps1"
      - "docs/WINDOWS_PREVIEW.md"
      - "src/**"
      - "tests/**"
      - "**.props"
      - "**.targets"
      - "NexusMods.App.sln"
      - "global.json"
      - ".gitmodules"
      - "extern/**"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/clean_environment_tests.yaml"
      - ".github/scripts/*windows-preview.ps1"
      - "docs/WINDOWS_PREVIEW.md"
      - "src/**"
      - "tests/**"
      - "**.props"
      - "**.targets"
      - "NexusMods.App.sln"
      - "global.json"
      - ".gitmodules"
      - "extern/**"
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

concurrency:
  group: clean-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  VSTEST_TESTHOST_SHUTDOWN_TIMEOUT: "60000"
  # Keep packages on the checkout volume so native dependencies can be hardlinked
  # into the many test outputs, including on Windows runners with separate drives.
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2022, ubuntu-24.04 ]

    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore NexusMods.App.sln

      - name: Build
        # MSBuild uses separate switches for project outputs and copied package
        # dependencies. The latter prevents repeating every native runtime in
        # every test directory. Source files and test fixtures remain copies.
        run: >-
          dotnet build NexusMods.App.sln --configuration Release --no-restore
          -p:CreateHardLinksForCopyFilesToOutputDirectoryIfPossible=true
          -p:CreateHardLinksForCopyLocalIfPossible=true

      - name: Prepare Windows native crash capture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'app-rework-procdump'
          $archive = Join-Path $env:RUNNER_TEMP 'app-rework-procdump.zip'
          Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $toolDirectory
          foreach ($name in @('procdump.exe', 'procdump64.exe')) {
            $tool = Join-Path $toolDirectory $name
            $signature = Get-AuthenticodeSignature $tool
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
              throw "ProcDump signature verification failed: $name"
            }
            Write-Host "$name version $((Get-Item $tool).VersionInfo.FileVersion)"
          }
          Write-Host "ProcDump archive SHA256: $((Get-FileHash $archive -Algorithm SHA256).Hash)"
          "PROCDUMP_PATH=$toolDirectory" | Add-Content $env:GITHUB_ENV
          # .NET's default crash collector does not capture native access violations.
          'VSTEST_DUMP_FORCEPROCDUMP=1' | Add-Content $env:GITHUB_ENV

      - name: Run tests without live service credentials
        id: tests
        shell: pwsh
        env:
          TEST_FILTER: "RequiresNetworking!=True&RequiresApiKey!=True&FlakeyTest!=True"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $failedProjects = @()
          New-Item -ItemType Directory -Path TestResults/diagnostics -Force | Out-Null
          (Get-Date).ToUniversalTime().ToString('o') | Set-Content TestResults/test-run-started.txt
          $solutionProjects = dotnet sln NexusMods.App.sln list
          if ($LASTEXITCODE -ne 0) { throw 'Unable to enumerate solution projects.' }
          $projects = @($solutionProjects | Where-Object { $_ -like '*.Tests.csproj' } | ForEach-Object { Get-Item $_.Replace('\', '/') } | Sort-Object FullName)
          if ($projects.Count -eq 0) { throw 'No test projects found.' }

          foreach ($project in $projects) {
            [xml] $projectXml = Get-Content $project.FullName -Raw
            $usesTUnit = @($projectXml.Project.ItemGroup.PackageReference.Include) -contains 'TUnit'

            if ($usesTUnit) {
              # SDK and backend tests use local fixtures. TUnit uses a different
              # runner and must not silently ignore the xUnit --filter option.
              dotnet run --project $project.FullName --configuration Release --no-build --no-restore
            } else {
              dotnet test $project.FullName --configuration Release --no-build --no-restore --filter $env:TEST_FILTER --logger "trx;LogFileName=$($project.BaseName).trx" --results-directory TestResults --blame-crash --blame-crash-dump-type mini --blame-hang-timeout 10m --blame-hang-dump-type mini --diag "TestResults/diagnostics/$($project.BaseName).log"
            }

            if ($LASTEXITCODE -ne 0) { $failedProjects += $project.BaseName }
          }

          if ($failedProjects.Count -gt 0) {
            throw "Failed test projects: $($failedProjects -join ', ')"
          }

      - name: Preserve Windows application crash events
        if: failure() && runner.os == 'Windows' && steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          # Supplement the dump with the faulting module/exception code when Windows
          # logged it. Diagnostics must not replace the original failed test result.
          try {
            $started = [datetime]::Parse((Get-Content TestResults/test-run-started.txt -Raw)).ToLocalTime()
            $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001, 1026; StartTime = $started } -ErrorAction Stop |
              Where-Object { $_.Message -match 'testhost|dotnet|NexusMods' } |
              Select-Object TimeCreated, Id, ProviderName, Message)
            ConvertTo-Json -InputObject $events -Depth 4 | Set-Content TestResults/diagnostics/windows-application-errors.json
          } catch {
            Write-Warning "Windows crash events were unavailable: $_"
          }

      - name: Publish Windows x64 development preview
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/publish-windows-preview.ps1

      - name: Check published Windows startup and separate storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/test-windows-preview.ps1

      - name: Package verified Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildInfo = Get-Content artifacts/windows-preview/BUILD-INFO.json -Raw | ConvertFrom-Json
          $shortCommit = $buildInfo.sourceCommit.Substring(0, 12)
          $archive = "artifacts/AppRework-windows-x64-$shortCommit.zip"
          Compress-Archive -Path artifacts/windows-preview/* -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($archive))" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Upload Windows development preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-rework-windows-x64
          path: |
            artifacts/AppRework-windows-x64-*.zip
            artifacts/AppRework-windows-x64-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test results and failed snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**
            tests/**/*.received.*
          if-no-files-found: ignore
          retention-days: 7
